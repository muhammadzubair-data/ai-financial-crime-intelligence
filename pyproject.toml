[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fincrime"
version = "1.0.0"
description = "AI Financial Crime Intelligence Platform: transaction risk scoring, network detection and investigation analytics on synthetic data"
requires-python = ">=3.10"
authors = [{ name = "Muhammad Zubair" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
