 x='671' y='414' font-size='18' fill='#5f6b7a' font-weight='bold' text-anchor='middle' font-family='Segoe UI,Helvetica,Arial,sans-serif' >+</text><rect x='678' y='390' width='250' height='36' rx='18' fill='#e8912d' fill-opacity='.12' stroke='#e8912d'/><text x='696' y='414' font-size='15' fill='#e8912d' font-weight='bold' text-anchor='start' font-family='Segoe UI,Helvetica,Arial,sans-serif' >20%</text><text x='742' y='414' font-size='14' fill='#1f2933' font-weight='normal' text-anchor='start' font-family='Segoe UI,Helvetica,Arial,sans-serif' >network evidence</text><text x='32' y='452' font-size='12.5' fill='#5f6b7a' font-weight='normal' text-anchor='start' font-family='Segoe UI,Helvetica,Arial,sans-serif' >Model evidence is the average of an account's three highest transaction scores, so a single odd payment does not raise an alert.</text></svg>